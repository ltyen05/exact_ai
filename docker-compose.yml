services:
  exact-api:
    build: .
    container_name: exact-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      EXACT_LLM_PROVIDER: "vllm"
      EXACT_LLM_BASE_URL: "http://host.docker.internal:11434/v1"
      EXACT_LLM_MODEL: "qwen2.5:7b-instruct"
      EXACT_LLM_API_KEY: "EMPTY"
      EXACT_ENABLE_LANGSMITH: "false"
      LANGSMITH_ENDPOINT: "https://api.smith.langchain.com"
      LANGSMITH_PROJECT: "exact-2026"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
